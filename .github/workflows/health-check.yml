name: 线上站点健康检查

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'vercel.json'
      - '.github/workflows/health-check.yml'
  workflow_dispatch:
  schedule:
    # 每周一 23:00 UTC+8 巡检
    - cron: '0 15 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 150s 部署等待 + 74 个模型页巡检 + 失败重试，15 分钟不够用
    timeout-minutes: 25

    env:
      # 用于核对线上部署版本（可选，缺失时跳过该检查）
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 等待 Vercel 部署生效
        # 本工作流与 deploy 由同一次 push 并行触发。直接开查会打到上一版线上站，
        # 新加的模型页必然 404 —— 曾因此误报过一轮。这里先等部署窗口过去。
        if: github.event_name == 'push'
        run: |
          echo "等待 150s，让 Vercel 完成本次部署…"
          sleep 150

      - name: 检查生产站点各页面
        run: |
          set -u
          BASE="https://modelsmark-sigma.vercel.app"
          FAILED=0

          # 带重试的抓取：3 次机会，间隔 20s。
          # 部署窗口内边缘节点可能短暂返回旧内容或 404，单次抓取会把瞬时态判成故障。
          probe() {
            local url="$1" out="$2" i code size
            for i in 1 2 3; do
              code=$(curl -s -o "$out" -w "%{http_code}" --max-time 30 "$url" || echo "000")
              size=$(wc -c < "$out" 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -ge 5000 ]; then
                echo "$code $size"
                return 0
              fi
              [ "$i" -lt 3 ] && sleep 20
            done
            echo "$code $size"
            return 1
          }

          for path in "/" "/channels/" "/plans/" "/calculator/" "/benchmarks/" "/about/" "/models/glm-5-3/"; do
            RESULT=$(probe "${BASE}${path}" /tmp/page.html) || true
            CODE=$(echo "$RESULT" | awk '{print $1}')
            SIZE=$(echo "$RESULT" | awk '{print $2}')
            TITLE=$(grep -o '<title>[^<]*</title>' /tmp/page.html 2>/dev/null | head -1 | sed 's/<[^>]*>//g')
            echo "${path} -> HTTP ${CODE} | ${SIZE} bytes | ${TITLE}"
            if [ "${CODE}" != "200" ] || [ "${SIZE}" -lt 5000 ]; then
              echo "  ::error::${path} 响应异常（HTTP ${CODE}, ${SIZE} bytes）"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 首页关键内容校验 ==="
          curl -s --max-time 30 "${BASE}/" -o /tmp/home.html || true
          # 关键词与改版后首页的区块 / 列名对应：
          # 可信度条（在售渠道）· 结论三卡（先看结论）· 矩阵（性价比矩阵）
          # · 三个 Top5 榜（能力指数）· 全量表（3:1 混合价）
          for kw in "ModelsMark" "先看结论" "性价比矩阵" "能力指数" "3:1 混合价" "在售渠道"; do
            CNT=$(grep -o "${kw}" /tmp/home.html 2>/dev/null | wc -l)
            echo "  ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::首页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 首页模型规模校验 ==="
          # 改版后主表默认折叠（首屏只渲染 12 行，其余由客户端展开），
          # 因此不能再靠数 <tr> 判断数据是否被覆盖 —— 改用两个更准的信号：
          #   1) 可信度条里的模型总数必须与模型表完全一致
          #   2) 首页出现的模型链接数（结论卡 + 三榜 + 主表）不得低于下限
          EXPECTED=$(node -e "
            const list = require('./data/seeds/models.json');
            console.log(list.length);
          " 2>/dev/null || echo 0)
          DECLARED=$(grep -o "<b>${EXPECTED}</b>个模型" /tmp/home.html 2>/dev/null | wc -l)
          echo "  模型表 ${EXPECTED} 个 / 首页可信度条声明匹配 ${DECLARED} 次"
          if [ "${EXPECTED}" -gt 0 ] && [ "${DECLARED}" -eq 0 ]; then
            echo "  ::error::首页声明的模型数与模型表 ${EXPECTED} 不一致，数据可能被部分覆盖"
            FAILED=1
          fi
          # 站内链接已改相对路径 + index.html（三种部署形态通吃），
          # 所以这里匹配的是 models/xxx/index.html 这种形态，不再是 /models/xxx/
          LINKS=$(grep -o 'href="[^"]*models/[^"]*index\.html"' /tmp/home.html 2>/dev/null | sort -u | wc -l)
          echo "  首页出现的模型链接: ${LINKS} 个"
          if [ "${LINKS}" -lt 15 ]; then
            echo "  ::error::首页模型链接仅 ${LINKS} 个，疑似数据丢失或表格未渲染"
            FAILED=1
          fi

          echo ""
          echo "=== 样式表可达性校验 ==="
          # 产物为兼容 file:// 直接打开，资源引用改成了相对路径。
          # 一旦相对层级算错，页面 HTML 仍是 200（SSR 内容还在），
          # 但样式表会 404 —— 页面白成裸 HTML，必须单独验样式表能不能取到。
          CSS_HREF=$(grep -o 'href="[^"]*\.css"' /tmp/home.html 2>/dev/null | head -1 | sed 's/href="//; s/"$//')
          echo "  首页引用的样式表: ${CSS_HREF:-<未找到>}"
          if [ -z "${CSS_HREF}" ]; then
            echo "  ::error::首页没有引用样式表，产物可能构建异常"
            FAILED=1
          else
            # 相对路径按站点根解析
            CSS_URL="${BASE}/${CSS_HREF#./}"
            CSS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${CSS_URL}" || echo "000")
            CSS_SIZE=$(curl -s --max-time 30 "${CSS_URL}" -o /tmp/site.css 2>/dev/null; wc -c < /tmp/site.css 2>/dev/null || echo 0)
            echo "  样式表响应: HTTP ${CSS_CODE} | ${CSS_SIZE} bytes"
            if [ "${CSS_CODE}" != "200" ] || [ "${CSS_SIZE}" -lt 1000 ]; then
              echo "  ::error::样式表不可达（HTTP ${CSS_CODE}, ${CSS_SIZE} bytes），站点会掉样式"
              FAILED=1
            fi
          fi

          echo ""
          echo "=== 套餐对比页数据校验 ==="
          # 架构冻结后价格榜已并入模型详情页，独立页改为「套餐对比」
          curl -s --max-time 30 "${BASE}/plans/" -o /tmp/plans.html || true
          PSIZE=$(wc -c < /tmp/plans.html 2>/dev/null || echo 0)
          echo "  plans 页大小: ${PSIZE} bytes（正常应 > 20KB）"
          if [ "${PSIZE}" -lt 20000 ]; then
            echo "  ::error::plans 页体积异常，疑似返回了 404 页"
            FAILED=1
          fi
          for kw in "Token Plan" "Agent Plan" "折合"; do
            CNT=$(grep -o "${kw}" /tmp/plans.html 2>/dev/null | wc -l)
            echo "  ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::套餐页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 渠道页 / 成本估算页关键词校验 ==="
          # 这两个页都是改版后新增的，一旦路由或数据链路断了会静默变 404 壳，
          # 光看 HTTP 200 看不出来，必须落到关键词上。
          curl -s --max-time 30 "${BASE}/channels/" -o /tmp/channels.html || true
          for kw in "覆盖最广" "平均溢价" "怎么读溢价"; do
            CNT=$(grep -o "${kw}" /tmp/channels.html 2>/dev/null | wc -l)
            echo "  channels ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::渠道页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          curl -s --max-time 30 "${BASE}/calculator/" -o /tmp/calc.html || true
          for kw in "月成本" "缓存命中率" "输入 : 输出"; do
            CNT=$(grep -o "${kw}" /tmp/calc.html 2>/dev/null | wc -l)
            echo "  calculator ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::成本估算页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 模型详情页全量巡检 ==="
          # 从仓库的 data/seeds/models.json 取出全部模型 slug（id 即 slug），逐个访问详情页，
          # 确保不是只有个别页面正常（曾出现过首页正常但部分模型页 404 的情况）。
          MODEL_SLUGS=$(node -e "
            const list = require('./data/seeds/models.json');
            const slugs = [...new Set(list.map(m => m.id).filter(Boolean))];
            console.log(slugs.join(' '));
          " 2>/dev/null || echo "")
          MODEL_COUNT=0
          MODEL_BAD=0
          # 模型页数量多，用更短的重试窗口，避免最坏情况下拖到超时
          probe_fast() {
            local url="$1" out="$2" i code size
            for i in 1 2; do
              code=$(curl -s -o "$out" -w "%{http_code}" --max-time 20 "$url" || echo "000")
              size=$(wc -c < "$out" 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -ge 5000 ]; then
                echo "$code $size"
                return 0
              fi
              [ "$i" -lt 2 ] && sleep 10
            done
            echo "$code $size"
            return 1
          }

          for slug in ${MODEL_SLUGS}; do
            RESULT=$(probe_fast "${BASE}/models/${slug}/" /tmp/m.html) || true
            CODE=$(echo "$RESULT" | awk '{print $1}')
            SIZE=$(echo "$RESULT" | awk '{print $2}')
            MODEL_COUNT=$((MODEL_COUNT + 1))
            if [ "${CODE}" != "200" ] || [ "${SIZE}" -lt 5000 ]; then
              echo "  ::error::模型页 ${slug} 异常（HTTP ${CODE}, ${SIZE} bytes）"
              MODEL_BAD=$((MODEL_BAD + 1))
              FAILED=1
            fi
          done
          echo "  已巡检 ${MODEL_COUNT} 个模型详情页，异常 ${MODEL_BAD} 个"
          if [ "${MODEL_COUNT}" -eq 0 ]; then
            echo "  ::error::未能解析模型列表，巡检覆盖度存疑"
            FAILED=1
          fi

          echo ""
          echo "=== 线上部署版本核对 ==="
          if [ -n "${VERCEL_TOKEN}" ]; then
            DEPLOY_JSON=$(curl -s --max-time 30 \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=prj_spk2JAmo033slq7ARiqyI54Mkith&target=production&limit=1" \
              || echo "")
            DEPLOY_STATE=$(echo "${DEPLOY_JSON}" | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                try {
                  const j = JSON.parse(s);
                  const list = j.deployments || j;
                  const d = list[0] || {};
                  console.log((d.state||d.readyState||'?') + '|' + (d.meta && d.meta.githubCommitSha ? d.meta.githubCommitSha.slice(0,8) : 'n/a'));
                } catch(e) { console.log('PARSE_ERROR|n/a'); }
              });
            ")
            echo "  最新生产部署: ${DEPLOY_STATE}"
          else
            echo "  (未配置 VERCEL_TOKEN，跳过部署版本核对)"
          fi

          echo ""
          if [ "${FAILED}" -eq 0 ]; then
            echo "✅ 线上站点全部正常"
          else
            echo "❌ 线上站点存在异常，见上方 ::error:: 标注"
            exit 1
          fi
