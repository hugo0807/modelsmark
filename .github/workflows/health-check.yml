name: 线上站点健康检查

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'vercel.json'
      - '.github/workflows/health-check.yml'
  workflow_dispatch:
  schedule:
    # 每周一 23:00 UTC+8 巡检
    - cron: '0 15 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 用于核对线上部署版本（可选，缺失时跳过该检查）
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查生产站点各页面
        run: |
          set -u
          BASE="https://modelsmark-sigma.vercel.app"
          FAILED=0

          for path in "/" "/plans/" "/benchmarks/" "/about/" "/models/glm-5-3/"; do
            CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" --max-time 30 "${BASE}${path}" || echo "000")
            SIZE=$(wc -c < /tmp/page.html 2>/dev/null || echo 0)
            TITLE=$(grep -o '<title>[^<]*</title>' /tmp/page.html 2>/dev/null | head -1 | sed 's/<[^>]*>//g')
            # 404 页面的特征：内容里没有站点主标题
            IS404=$(grep -c "404" /tmp/page.html 2>/dev/null || echo 0)
            echo "${path} -> HTTP ${CODE} | ${SIZE} bytes | ${TITLE}"
            if [ "${CODE}" != "200" ] || [ "${SIZE}" -lt 5000 ]; then
              echo "  ::error::${path} 响应异常（HTTP ${CODE}, ${SIZE} bytes）"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 首页关键内容校验 ==="
          curl -s --max-time 30 "${BASE}/" -o /tmp/home.html || true
          # 关键词与首页表格当前列名对应：
          # 速览表列 = 模型 / 厂商 / 最低价 / 最高价 / 价差 / 智能指数 / 可选渠道
          for kw in "ModelsMark" "性价比" "最低价" "最高价" "价差" "智能指数"; do
            CNT=$(grep -o "${kw}" /tmp/home.html 2>/dev/null | wc -l)
            echo "  ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::首页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 首页模型数量校验 ==="
          # 线上模型行数不得明显少于仓库模型表 —— 防止数据被部分覆盖后悄悄变少。
          # 速览表只列「有按量报价」的模型，因此行数会略少于模型表（差几个属正常）。
          EXPECTED=$(node -e "
            const list = require('./data/seeds/models.json');
            console.log(list.length);
          " 2>/dev/null || echo 0)
          ACTUAL=$(grep -o '<tr>' /tmp/home.html 2>/dev/null | wc -l)
          echo "  模型表 ${EXPECTED} 个 / 首页表格 ${ACTUAL} 行"
          if [ "${EXPECTED}" -gt 20 ] && [ "${ACTUAL}" -lt $((EXPECTED * 8 / 10)) ]; then
            echo "  ::error::首页模型行数 ${ACTUAL} 不足模型表 ${EXPECTED} 的 80%，数据可能被部分覆盖"
            FAILED=1
          fi

          echo ""
          echo "=== 套餐对比页数据校验 ==="
          # 架构冻结后价格榜已并入模型详情页，独立页改为「套餐对比」
          curl -s --max-time 30 "${BASE}/plans/" -o /tmp/plans.html || true
          PSIZE=$(wc -c < /tmp/plans.html 2>/dev/null || echo 0)
          echo "  plans 页大小: ${PSIZE} bytes（正常应 > 20KB）"
          if [ "${PSIZE}" -lt 20000 ]; then
            echo "  ::error::plans 页体积异常，疑似返回了 404 页"
            FAILED=1
          fi
          for kw in "Token Plan" "Agent Plan" "折合"; do
            CNT=$(grep -o "${kw}" /tmp/plans.html 2>/dev/null | wc -l)
            echo "  ${kw}: ${CNT} 次"
            if [ "${CNT}" -eq 0 ]; then
              echo "  ::error::套餐页缺少关键词 ${kw}，疑似 404 页"
              FAILED=1
            fi
          done

          echo ""
          echo "=== 模型详情页全量巡检 ==="
          # 从仓库的 data/seeds/models.json 取出全部模型 slug（id 即 slug），逐个访问详情页，
          # 确保不是只有个别页面正常（曾出现过首页正常但部分模型页 404 的情况）。
          MODEL_SLUGS=$(node -e "
            const list = require('./data/seeds/models.json');
            const slugs = [...new Set(list.map(m => m.id).filter(Boolean))];
            console.log(slugs.join(' '));
          " 2>/dev/null || echo "")
          MODEL_COUNT=0
          MODEL_BAD=0
          for slug in ${MODEL_SLUGS}; do
            CODE=$(curl -s -o /tmp/m.html -w "%{http_code}" --max-time 20 "${BASE}/models/${slug}/" || echo "000")
            SIZE=$(wc -c < /tmp/m.html 2>/dev/null || echo 0)
            MODEL_COUNT=$((MODEL_COUNT + 1))
            if [ "${CODE}" != "200" ] || [ "${SIZE}" -lt 5000 ]; then
              echo "  ::error::模型页 ${slug} 异常（HTTP ${CODE}, ${SIZE} bytes）"
              MODEL_BAD=$((MODEL_BAD + 1))
              FAILED=1
            fi
          done
          echo "  已巡检 ${MODEL_COUNT} 个模型详情页，异常 ${MODEL_BAD} 个"
          if [ "${MODEL_COUNT}" -eq 0 ]; then
            echo "  ::error::未能解析模型列表，巡检覆盖度存疑"
            FAILED=1
          fi

          echo ""
          echo "=== 线上部署版本核对 ==="
          if [ -n "${VERCEL_TOKEN}" ]; then
            DEPLOY_JSON=$(curl -s --max-time 30 \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=prj_spk2JAmo033slq7ARiqyI54Mkith&target=production&limit=1" \
              || echo "")
            DEPLOY_STATE=$(echo "${DEPLOY_JSON}" | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                try {
                  const j = JSON.parse(s);
                  const list = j.deployments || j;
                  const d = list[0] || {};
                  console.log((d.state||d.readyState||'?') + '|' + (d.meta && d.meta.githubCommitSha ? d.meta.githubCommitSha.slice(0,8) : 'n/a'));
                } catch(e) { console.log('PARSE_ERROR|n/a'); }
              });
            ")
            echo "  最新生产部署: ${DEPLOY_STATE}"
          else
            echo "  (未配置 VERCEL_TOKEN，跳过部署版本核对)"
          fi

          echo ""
          if [ "${FAILED}" -eq 0 ]; then
            echo "✅ 线上站点全部正常"
          else
            echo "❌ 线上站点存在异常，见上方 ::error:: 标注"
            exit 1
          fi
