name: 构建并部署到 Vercel

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 构建静态站
        run: npm run build

      # 首选方案：仓库已通过 Vercel Git 集成关联，push 即自动部署。
      # 本 workflow 仅作校验与产物留档；真正的发布由 Vercel 的 Git 集成完成。
      - name: 上传构建产物存档
        uses: actions/upload-artifact@v4
        with:
          name: modelsmark-build-${{ github.run_number }}
          path: out
          retention-days: 7
          if-no-files-found: error
