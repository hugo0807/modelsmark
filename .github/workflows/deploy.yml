name: 构建并部署到 Vercel

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 项目标识非敏感，直接写在 workflow 里；
    # 唯一需要保密的是 VERCEL_TOKEN（存在 GitHub Secrets 中）。
    env:
      VERCEL_ORG_ID: team_onk3Co4tJV53iEuL3UPhh8Ap
      VERCEL_PROJECT_ID: prj_spk2JAmo033slq7ARiqyI54Mkith
      VERCEL_CLI_VERSION: 65.2.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      # ---- 部署 ----
      # 采用 vercel build + deploy --prebuilt 方案：
      #   1. 构建在 GitHub runner 上完成（Linux 环境，无 Windows trace 句柄问题）
      #   2. --prebuilt 直接上传 .vercel/output 静态产物，不在 Vercel 侧二次构建
      #   3. 不依赖 Vercel 的 Git 集成，国内网络环境下依旧可靠
      - name: 校验 Token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::缺少 VERCEL_TOKEN secret，请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          echo "Token 已配置"

      - name: 拉取 Vercel 项目配置
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 构建静态站
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 部署到 Vercel 生产环境
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 打印部署地址
        if: always()
        run: |
          echo "生产地址：https://modelsmark-sigma.vercel.app"
          echo "国内备用：https://modelsmark.app.workbuddy.host/?sharecode=B446I2BLWQ"
