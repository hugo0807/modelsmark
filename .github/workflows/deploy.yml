name: 构建并部署到 Vercel

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      # ---- 部署 ----
      # 采用 vercel build + deploy --prebuilt 方案：
      #   1. 构建在本仓库 runner 上完成（Linux 环境不受 Windows trace 句柄问题影响）
      #   2. --prebuilt 直接上传 .vercel/output 静态产物，不在 Vercel 侧二次构建
      #   3. 不依赖 Vercel 的 Git 集成，国内网络环境下依旧可靠
      - name: 拉取 Vercel 项目配置
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 构建静态站
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 部署到 Vercel 生产环境
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 打印部署地址
        if: always()
        run: |
          echo "生产地址：https://modelsmark-sigma.vercel.app"
          echo "可访问性检查：curl -sI https://modelsmark-sigma.vercel.app"
