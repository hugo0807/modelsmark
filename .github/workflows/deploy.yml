name: 构建并部署到 Vercel

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'db/**'
      - 'public/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 项目标识非敏感，直接写在 workflow 里；
    # 唯一需要保密的是 VERCEL_TOKEN（存在 GitHub Secrets 中）。
    env:
      VERCEL_ORG_ID: team_onk3Co4tJV53iEuL3UPhh8Ap
      VERCEL_PROJECT_ID: prj_spk2JAmo033slq7ARiqyI54Mkith
      VERCEL_CLI_VERSION: 65.2.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 校验 Token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::缺少 VERCEL_TOKEN secret，请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          echo "Token 已配置"

      # 部署前先在本地构建并校验产物。
      # Vercel 只负责发布，不看产物对不对；这里挡住「资源路径相对层级算错」
      # 这类问题 —— 它的表现是页面白成裸 HTML，但 HTTP 仍然是 200，
      # 线上巡检要等部署完才发现，已经来不及了。
      - name: 本地构建并校验产物可移植性
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check:portable

      - name: 拉取 Vercel 项目配置
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # 构建与部署都交给 Vercel：
      #   vercel.json 已配置 framework=null + outputDirectory=out，
      #   Vercel 会执行 npm run build（Next.js 静态导出）并发布 out/ 产物。
      #   不使用 --prebuilt，避免 CLI 把源码目录一并上传导致框架识别错误。
      - name: 部署到 Vercel 生产环境
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 打印部署地址
        if: always()
        run: |
          echo "生产地址：https://modelsmark-sigma.vercel.app"
          echo "国内备用：https://modelsmark.app.workbuddy.host/?sharecode=B446I2BLWQ"
